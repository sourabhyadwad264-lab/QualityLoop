spring.application.name=qualityloopv2
server.port=8081
spring.datasource.url=jdbc:mysql://localhost:3306/qualityloopv2?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# Security
app.jwt.secret=${JWT_SECRET:change-this-development-secret-key-at-least-32-characters}
app.jwt.expiry-minutes=480
app.admin.password=${ADMIN_PASSWORD:}

# Link used inside shared reports (change when the frontend is hosted online)
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Email (Gmail example: use an App Password, not your normal password)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
